# ============================================================
#  nginx-student-app.conf
#  Nginx Reverse Proxy Configuration
#
#  Location on server: /etc/nginx/sites-available/student-app
#
#  What this does:
#   - Listens on Port 80 (public)
#   - Forwards all /student traffic to Backend Tomcat :8080
#   - Passes real client IP headers to backend
#   - Redirects root URL to /student
# ============================================================

server {
    listen 80;
    server_name _;

    # ── Forward /student requests to Tomcat backend ──────────
    location /student {
        proxy_pass         http://172.31.31.161:8080/student;

        # Pass real client information to the backend app
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Connection timeout settings
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ── Redirect root "/" to "/student" ───────────────────────
    location / {
        return 301 /student;
    }
}
